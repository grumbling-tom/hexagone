pre-commit:
  parallel: true
  commands:
    biome:
      root: apps/web/
      glob: "*.{js,ts,jsx,tsx,json,mjs}"
      run: pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
    typecheck:
      root: apps/web/
      run: pnpm exec astro check
    ruff-lint:
      root: apps/backend/
      glob: "*.py"
      run: uv run ruff check
    ruff-format:
      root: apps/backend/
      glob: "*.py"
      run: uv run ruff format --check
    pyright:
      root: apps/backend/
      run: uv run pyright
