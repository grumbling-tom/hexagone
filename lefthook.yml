pre-commit:
  piped: true
  commands:
    gen-api-client:
      env:
        ENV: TEST # Used by the backend for Settings instantiation.
      priority: 0
      glob: "*.{py,ts,json}"
      # api:gen regenerates files OUTSIDE the staged set (the OpenAPI spec and
      # the orval client — a route docstring alone changes them, since FastAPI
      # uses it as the operation description). `stage_fixed` only re-stages
      # already-staged files, so it misses these; stage them explicitly,
      # otherwise a stale client gets committed and CI's regen-and-diff fails.
      run: pnpm -C apps/web api:gen && git add apps/backend/__generated__/openapi.json apps/web/src/__generated__/backend-client
    gen-email-theme:
      priority: 0
      # The email token module mirrors apps/web/src/styles/theme.css. Regenerate
      # it (and re-stage, like gen-api-client above) whenever theme.css changes,
      # so the committed copy the backend image ships never drifts from source.
      glob: "apps/web/src/styles/theme.css"
      run: uv run --project apps/backend python apps/backend/src/scripts/gen_email_theme.py && git add apps/backend/src/app/services/email_theme.py
    biome:
      root: apps/web/
      glob: "*.{js,ts,jsx,tsx,json,mjs}"
      run: pnpm exec biome check --fix --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    prettier:
      root: apps/web/
      glob: "*.css"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      root: apps/web/
      run: pnpm check
    check-imports:
      root: apps/web/
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm lint:imports
    check-app-structure:
      root: apps/web/
      glob: "*.{ts,tsx,mts,cts}"
      run: pnpm lint:app-structure
    ruff-lint:
      root: apps/backend/
      glob: "*.py"
      run: uv run ruff check --fix
      stage_fixed: true
    ruff-format:
      root: apps/backend/
      glob: "*.py"
      run: uv run ruff format
      stage_fixed: true
    pyright:
      root: apps/backend/
      run: uv run pyright
    validate-migrations:
      root: apps/backend/
      glob: "*.py"
      run: uv run python src/scripts/validate_migrations.py
