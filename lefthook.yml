pre-commit:
  piped: true
  commands:
    gen-api-client:
      env:
        ENV: TEST # Used by the backend for Settings instantiation.
      priority: 0
      glob: "*.{py,ts,json}"
      run: pnpm -C apps/web api:gen
      stage_fixed: true
    biome:
      root: apps/web/
      glob: "*.{js,ts,jsx,tsx,json,mjs}"
      run: pnpm exec biome check --fix --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    prettier:
      root: apps/web/
      glob: "*.css"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    typecheck:
      root: apps/web/
      run: pnpm exec astro check
    ruff-lint:
      root: apps/backend/
      glob: "*.py"
      run: uv run ruff check --fix
      stage_fixed: true
    ruff-format:
      root: apps/backend/
      glob: "*.py"
      run: uv run ruff format
      stage_fixed: true
    pyright:
      root: apps/backend/
      run: uv run pyright
    validate-migrations:
      root: apps/backend/
      glob: "*.py"
      run: uv run python src/scripts/validate_migrations.py
    terraform-fmt:
      root: terraform/
      glob: "*.tf"
      run: terraform fmt -check -diff -recursive
    terraform-validate:
      root: terraform/production/
      glob: "*.tf"
      run: terraform validate
