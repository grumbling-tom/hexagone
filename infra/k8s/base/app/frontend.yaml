# Hexagone web — the Next.js production server (apps/web).
#
# Image: standalone Next build (`node server.js`), from apps/web/Dockerfile — see
# infra/k8s/README.md. Next is the single entrypoint: cloudflared points only here.
# The browser makes no backend calls; Next reaches the backend server-side (React
# Server Components + Server Actions, via the BACKEND_ORIGIN env below).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexagone-web
  labels:
    app: hexagone-web
spec:
  replicas: 1 # single-node box: extra replicas add no HA
  selector:
    matchLabels:
      app: hexagone-web
  template:
    metadata:
      labels:
        app: hexagone-web
    spec:
      containers:
        - name: web
          image: hexagone-web:latest
          imagePullPolicy: IfNotPresent # use the locally-built image, don't pull
          ports:
            - name: http
              containerPort: 3000
          # The fetch client (apps/web/src/lib/fetch-client.ts) reads BACKEND_ORIGIN
          # at request time in RSC / Server Actions, so it's a runtime env — the
          # in-cluster backend Service, reachable from this pod in `default`.
          env:
            - name: BACKEND_ORIGIN
              value: http://hexagone-backend.default.svc.cluster.local:8000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hexagone-web
  labels:
    app: hexagone-web
spec:
  selector:
    app: hexagone-web
  ports:
    - name: http
      port: 80 # keep the Service on 80 so the tunnel config is unchanged
      targetPort: http
