# Hexagone web — the Next.js production server (apps/web).
#
# Image: standalone Next build (`node server.js`), from apps/web/Dockerfile — see
# infra/k8s/README.md. Next serves the UI AND proxies /api to the backend
# (next.config.mjs rewrites, target = BACKEND_ORIGIN below), so this is the single
# entrypoint: cloudflared points only here and no longer path-splits.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexagone-web
  labels:
    app: hexagone-web
spec:
  replicas: 1 # single-node box: extra replicas add no HA
  selector:
    matchLabels:
      app: hexagone-web
  template:
    metadata:
      labels:
        app: hexagone-web
    spec:
      containers:
        - name: web
          image: hexagone-web:latest
          imagePullPolicy: IfNotPresent # use the locally-built image, don't pull
          ports:
            - name: http
              containerPort: 3000
          # The /api proxy target (BACKEND_ORIGIN) is baked into the image at build
          # time — Next evaluates next.config rewrites() during the build, so it's a
          # Dockerfile ARG (defaults to the backend Service), not a runtime env.
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: hexagone-web
  labels:
    app: hexagone-web
spec:
  selector:
    app: hexagone-web
  ports:
    - name: http
      port: 80 # keep the Service on 80 so the tunnel config is unchanged
      targetPort: http
