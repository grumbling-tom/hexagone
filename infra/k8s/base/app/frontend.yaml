# Hexagone web — the Astro static build (apps/web) served by nginx.
#
# Image: multi-stage build of apps/web (`astro build` -> dist/) copied into
# nginx, built from apps/web/Dockerfile — see infra/k8s/README.md. The generated
# API client is committed, so the build is self-contained (no backend at build time).
#
# The app calls /api/* same-origin; cloudflared splits the public hostname — /api
# to the backend, everything else here — so nginx only ever serves static assets.
# (See the tunnel ingress in infra/terraform/cloudflare.tf.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hexagone-web
  labels:
    app: hexagone-web
spec:
  replicas: 1 # single-node box: extra replicas add no HA
  selector:
    matchLabels:
      app: hexagone-web
  template:
    metadata:
      labels:
        app: hexagone-web
    spec:
      containers:
        - name: web
          image: hexagone-web:latest
          imagePullPolicy: IfNotPresent # imported into containerd, not pulled
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: nginx-conf
          configMap:
            name: hexagone-web-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: hexagone-web
  labels:
    app: hexagone-web
spec:
  selector:
    app: hexagone-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
# SPA fallback: Astro builds `/` (index.astro) and `/app` (app.astro, the React
# Router SPA under basename "/app"). Client routes like /app/settings have no
# built file, so serve /app/index.html for anything under /app. The astro.config
# comment spells out this exact rule (/app/* -> /app/index.html).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hexagone-web-nginx
data:
  default.conf: |
    server {
      listen 80;
      root /usr/share/nginx/html;
      index index.html;

      location /app {
        try_files $uri $uri/ /app/index.html;
      }

      location / {
        try_files $uri $uri/ =404;
      }
    }
