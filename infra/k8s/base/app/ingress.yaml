# Traefik Ingress — the in-git HTTP routing that cloudflared forwards to.
#
# cloudflared sends ALL traffic for the public hostname to the Traefik Service;
# these rules then split it. Host-less (catch-all) for now so `kustomize build`
# is valid before the public hostname is chosen — pin `host:` once decided.
#
# TODO(next.js): migrating the frontend from the Astro SPA to Next.js would make
# the web app the SINGLE entrypoint into the cluster — Next.js serves the UI and
# owns routing (its `rewrites` proxy /api/* to the backend Service). cloudflared
# would then point at one `hexagone-web` Service and this Ingress + Traefik
# path-split could be retired entirely. See infra/k8s/README.md "Roadmap".
#
# FRONTEND DECISION still open (infra/k8s/README.md, option A vs B):
#  - A (single edge): add a `/` route to an in-cluster nginx serving the built
#    SPA, and retire S3/CloudFront for the web. (Uncomment the web paths below
#    and add a `hexagone-web` Deployment+Service.)
#  - B (split edge): leave only `/api` here; the SPA stays on S3/CloudFront.
#
# Confirm Traefik is actually the ingress controller in this k3s:
#   kubectl get pods -n kube-system | grep traefik
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hexagone
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hexagone-backend
                port:
                  number: 8000
          # --- Option A: serve the SPA from the cluster (uncomment) ---
          # - path: /
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: hexagone-web
          #       port:
          #         number: 80
