# cloudflared — the app's only public entry point.
#
# Runs the Cloudflare Tunnel daemon as an ordinary Deployment (NOT an operator).
# It dials OUTBOUND to Cloudflare's edge and holds the connection open; no
# inbound port is ever opened on the Mac mini. Cloudflare terminates TLS, serves
# the custom domain, and is where you add WAF / rate-limiting / bot rules.
#
# Token-based ("remotely-managed") tunnel: the hostname -> service routing lives
# in the Cloudflare Zero Trust dashboard (Networks -> Tunnels -> your tunnel ->
# Public Hostnames). Point that public hostname at the in-cluster Traefik:
#     Service: http://traefik.kube-system.svc.cluster.local:80
# Traefik then applies the Ingress rules in app/ingress.yaml (routing stays in git).
#
# The TUNNEL_TOKEN is supplied via a Secret created out-of-band (never in git):
#   kubectl create secret generic cloudflared-token \
#     --from-literal=token='eyJ...'   # the token from the dashboard
#
# Pattern adapted from Cloudflare's k8s guide:
# https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/deployment-guides/kubernetes/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  # Two replicas => the tunnel keeps >1 edge connection, so a pod restart never
  # drops the public endpoint. cloudflared handles this natively.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.6.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          livenessProbe:
            httpGet:
              # cloudflared serves /ready on the metrics port; 200 once the
              # tunnel has at least one healthy connection to the edge.
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
