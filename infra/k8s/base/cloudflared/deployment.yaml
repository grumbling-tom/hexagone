# cloudflared — the app's only public entry point.
#
# Runs the Cloudflare Tunnel daemon as an ordinary Deployment (NOT an operator).
# It dials OUTBOUND to Cloudflare's edge and holds the connection open; no
# inbound port is ever opened on the Mac mini. Cloudflare terminates TLS, serves
# the custom domain, and is where you add WAF / rate-limiting / bot rules.
#
# Token-based ("remotely-managed") tunnel: the hostname -> service routing is
# managed by Terraform (infra/terraform/cloudflare.tf), not a local config file.
# This k3s has no ingress controller, so cloudflared itself path-splits the public
# hostname — /api -> hexagone-backend, everything else -> hexagone-web — routing
# straight to the in-cluster Services.
#
# The TUNNEL_TOKEN is supplied via a Secret created out-of-band (never in git),
# piped from the Terraform output:
#   kubectl create secret generic cloudflared-token \
#     --from-literal=token="$(terraform -chdir=infra/terraform output -raw cloudflared_token)"
#
# Pattern adapted from Cloudflare's k8s guide:
# https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/deployment-guides/kubernetes/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  # Single-node box: 1 replica. One cloudflared pod still opens 4 edge connections
  # (connection-level redundancy), so steady state is fine; the only gap is the few
  # seconds during a pod restart/rollout. Bump to 2 if you want zero-gap restarts.
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.6.0
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          livenessProbe:
            httpGet:
              # cloudflared serves /ready on the metrics port; 200 once the
              # tunnel has at least one healthy connection to the edge.
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
