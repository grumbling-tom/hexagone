services:
  postgres:
    image: postgres:17-alpine
    container_name: hexagone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: hexagone-localstack
    ports:
      - "4566:4566"
    environment:
      # S3 only — GPX upload/download presigned URLs in dev. Lambda emulation
      # is gone now that the backend runs as a persistent service (prod uses
      # Tigris for object storage; see infra/k8s/base/app/backend.yaml).
      - SERVICES=s3
      - S3_SKIP_SIGNATURE_VALIDATION=0
      - DEFAULT_REGION=eu-west-2
      - EXTRA_CORS_ALLOWED_ORIGINS=http://localhost:3000
      - EXTRA_CORS_ALLOWED_HEADERS=content-disposition
      - DEBUG=0
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - localstack_data:/var/lib/localstack

  # One-shot migration runner. Applies Alembic migrations against the local
  # DB and exits; the backend waits for it to finish via
  # `depends_on: { condition: service_completed_successfully }`. Mirrors the
  # `migrate` initContainer in infra/k8s/base/app/backend.yaml — same image,
  # same `alembic upgrade head`, reading DATABASE_URL via src/app/settings.
  migrate:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: hexagone-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      ENV: DEV
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/app/src

  hexagone-backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: hexagone-backend
    # Host networking so presigned URLs generated by the backend point to
    # localhost, letting the frontend (on the host) upload directly to the
    # localstack S3 endpoint. Postgres and localstack are reached on localhost
    # via their published ports.
    network_mode: host
    command:
      - uvicorn
      - src.app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    environment:
      ENV: DEV
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HEXAGONE_S3_ENDPOINT_URL: http://localhost:4566
      # https://docs.localstack.cloud/aws/capabilities/config/credentials/#structured-access-key-id
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
      THROTTLE_DELAY_SECONDS: 0.5
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/backend/src:/app/src

  hexagone-web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      # Dev stage (next dev + hot reload), not the production standalone image.
      target: dev
    container_name: hexagone-web
    # Bridge networking + published port. A browser-facing dev server must be
    # reachable on the *host's* localhost:3000, and `network_mode: host` does
    # NOT achieve that on Docker Desktop (macOS/Windows): containers run in a
    # Linux VM, so host mode binds the VM's network, not the Mac's loopback.
    # The backend keeps host networking (for presigned-URL localhost reasons),
    # so we reach it from this bridge container via host.docker.internal rather
    # than localhost. localhost:3000 stays the origin portless proxies (#45).
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_ORIGIN: http://host.docker.internal:8000
      # next dev uses webpack here; over a bind mount on macOS/Windows its
      # file watcher misses host edits unless it polls. This restores HMR.
      WATCHPACK_POLLING: "true"
    volumes:
      # Bind-mount the source for live edits; keep node_modules and .next as
      # container-owned volumes so the host's macOS node_modules and any local
      # .next build don't leak in over the Linux ones.
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  localstack_data:
