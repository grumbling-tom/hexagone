services:
  postgres:
    image: postgres:17-alpine
    container_name: hexagone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: hexagone-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,lambda
      - LAMBDA_DOCKER_NETWORK=hexagone_default
      - S3_SKIP_SIGNATURE_VALIDATION=0
      - DEFAULT_REGION=eu-west-2
      - EXTRA_CORS_ALLOWED_ORIGINS=http://localhost:4321
      - EXTRA_CORS_ALLOWED_HEADERS=content-disposition
      - DEBUG=0
    volumes:
      - "./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh"
      - "./apps/backend:/opt/code/backend"
      - "/var/run/docker.sock:/var/run/docker.sock"
      - localstack_data:/var/lib/localstack

  hexagone-lambda-db-ops:
    build:
      context: apps/backend
      dockerfile: Dockerfile.lambda
    container_name: hexagone-lambda-db-ops
    command: ["src.app.handlers.db.handler"]
    environment:
      ENV: DEV
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Bridge-networked container: address localstack via its compose
      # service name, not localhost.
      HEXAGONE_S3_ENDPOINT_URL: http://localstack:4566
      # https://docs.localstack.cloud/aws/capabilities/config/credentials/#structured-access-key-id
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "9001:8080"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/var/task/src
    post_start:
      - command: curl -X POST "http://localhost:8080/2015-03-31/functions/function/invocations" -d '{"action":"migrate"}'
        user: root

  hexagone-lambda-file-upload:
    build:
      context: apps/backend
      dockerfile: Dockerfile.lambda
    container_name: hexagone-lambda-file-upload
    command: ["src.app.handlers.file_upload.handler"]
    environment:
      ENV: DEV
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Bridge-networked container: address localstack via its compose
      # service name, not localhost.
      HEXAGONE_S3_ENDPOINT_URL: http://localstack:4566
      # https://docs.localstack.cloud/aws/capabilities/config/credentials/#structured-access-key-id
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "9002:8080"
    volumes:
      - ./apps/backend/src:/var/task/src

  hexagone-backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile.lambda
      target: dev
    container_name: hexagone-backend
    # We use host networking so that presigned URLs generated by the backend point to localhost,
    # which allows the frontend running on the host to perform the upload.
    # The lambda containers will use the docker DNS to resolve 'postgres' and 'localstack' to the container.
    network_mode: host
    command:
      - uv
      - run
      - uvicorn
      - src.app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    environment:
      ENV: DEV
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HEXAGONE_S3_ENDPOINT_URL: http://localhost:4566
      # https://docs.localstack.cloud/aws/capabilities/config/credentials/#structured-access-key-id
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/var/task/src

volumes:
  postgres_data:
  localstack_data:

networks:
  # Pin the default network name so localstack can attach spawned lambda
  # containers to it via LAMBDA_DOCKER_NETWORK=hexagone_default. Without
  # this, compose derives the network name from the directory (e.g.
  # `hexagone-process-uploads_default` in a worktree) and the env var
  # points at a network that doesn't exist — localstack then logs
  # "Unable to get main container IP address: hexagone_default" and the
  # S3-triggered lambda silently never fires.
  default:
    name: hexagone_default
