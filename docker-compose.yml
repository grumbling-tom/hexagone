services:
  postgres:
    image: postgres:17-alpine
    container_name: hexagone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local S3 for GPX upload/download presigned URLs in dev (prod uses Tigris;
  # see infra/k8s/base/app/backend.yaml). Replaces LocalStack, which moved its
  # S3 features behind a paywall. `server -s3` runs master + volume + filer +
  # the S3 gateway in one process; we put the gateway on 4566 so the endpoint
  # URL is unchanged from the LocalStack setup. SeaweedFS derives a static
  # admin identity from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY, so presigned
  # URLs signed by the backend with the same creds validate.
  seaweedfs:
    image: chrislusf/seaweedfs:4.34
    container_name: hexagone-seaweedfs
    command:
      - server
      - -s3
      - -s3.port=4566
      - -dir=/data
    ports:
      - "4566:4566"
    environment:
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      # The S3 gateway exposes an unauthenticated /healthz on its own port; the
      # master binds the container IP rather than localhost, so probe S3 here.
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # One-shot: create the GPX bucket and apply CORS once SeaweedFS is up, then
  # exit. SeaweedFS has no env-var CORS knob (LocalStack had one), so CORS is
  # set via the S3 API. The backend waits on this completing successfully.
  seaweedfs-init:
    image: amazon/aws-cli:latest
    container_name: hexagone-seaweedfs-init
    entrypoint: ["/bin/sh", "/init/seaweedfs-init.sh"]
    environment:
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-2
    volumes:
      - ./scripts/seaweedfs-init.sh:/init/seaweedfs-init.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy

  # One-shot migration runner. Applies Alembic migrations against the local
  # DB and exits; the backend waits for it to finish via
  # `depends_on: { condition: service_completed_successfully }`. Mirrors the
  # `migrate` initContainer in infra/k8s/base/app/backend.yaml — same image,
  # same `alembic upgrade head`, reading DATABASE_URL via src/app/settings.
  migrate:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: hexagone-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      ENV: DEV
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      # Settings validation requires these in DEV (LocalStack guard), even
      # though migrations don't touch S3. https://docs.localstack.cloud/aws/capabilities/config/credentials/
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/backend/src:/app/src

  hexagone-backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: hexagone-backend
    # Host networking so presigned URLs generated by the backend point to
    # localhost, letting the frontend (on the host) upload directly to the
    # SeaweedFS S3 endpoint. Postgres and seaweedfs are reached on localhost
    # via their published ports.
    network_mode: host
    command:
      - uvicorn
      - src.app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    environment:
      ENV: DEV
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HEXAGONE_S3_ENDPOINT_URL: http://localhost:4566
      # Must match the SeaweedFS admin identity (see the seaweedfs service) so
      # the backend's presigned URLs are signed with a key SeaweedFS accepts.
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
      THROTTLE_DELAY_SECONDS: 0.5
      ALLOWED_EMAILS: '["foo@bar.com"]'
      # Shared secret the upload-notifications webhook expects (Bearer token).
      UPLOAD_NOTIFICATION_SECRET: dev-notification-secret
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/backend/src:/app/src

  # Procrastinate worker — drains the queue and runs process_upload. Same image
  # as the backend; mirrors the hexagone-worker k8s Deployment. The backend
  # (web) only defers jobs; this process executes them. Host networking so it
  # reaches postgres/seaweedfs on localhost, exactly like the backend.
  hexagone-worker:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    container_name: hexagone-worker
    network_mode: host
    command: ["procrastinate", "--app=src.worker.main.app", "worker"]
    environment:
      ENV: DEV
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      HEXAGONE_S3_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: "000000000000"
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./apps/backend/src:/app/src

  hexagone-web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      # Dev stage (next dev + hot reload), not the production standalone image.
      target: dev
    container_name: hexagone-web
    # Bridge networking + published port. A browser-facing dev server must be
    # reachable on the *host's* localhost:3000, and `network_mode: host` does
    # NOT achieve that on Docker Desktop (macOS/Windows): containers run in a
    # Linux VM, so host mode binds the VM's network, not the Mac's loopback.
    # The backend keeps host networking (for presigned-URL localhost reasons),
    # so we reach it from this bridge container via host.docker.internal rather
    # than localhost. localhost:3000 stays the origin portless proxies (#45).
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_ORIGIN: http://host.docker.internal:8000
      # next dev uses webpack here; over a bind mount on macOS/Windows its
      # file watcher misses host edits unless it polls. This restores HMR.
      WATCHPACK_POLLING: "true"
    volumes:
      # Bind-mount the source for live edits; keep node_modules and .next as
      # container-owned volumes so the host's macOS node_modules and any local
      # .next build don't leak in over the Linux ones.
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  seaweedfs_data:
